[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grab-dl"
version = "0.1.0"
description = "yt-dlp, but you don't need the manual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unlicense" }
dependencies = ["yt-dlp"]

[project.scripts]
grab = "grab.cli:main"

[tool.setuptools]
packages = ["grab"]
